<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Boomerang 🇦🇺</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87CEEB;
}

canvas{
    display:block;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    font-size:32px;
    font-weight:bold;
    color:white;
    text-shadow:2px 2px 4px black;
    z-index:100;
}

#highScore{
    position:absolute;
    top:60px;
    left:20px;
    font-size:20px;
    color:white;
    text-shadow:2px 2px 4px black;
    z-index:100;
}

#startScreen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
    color:white;
    z-index:1000;
}

button{
    margin-top:20px;
    padding:15px 30px;
    font-size:22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#ff9800;
    color:white;
}
</style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="highScore">High Score: 0</div>

<div id="startScreen">
    <h1>🪃 Flappy Boomerang</h1>
    <p>Fly across Australia and dodge the gum trees!</p>
    <button onclick="startGame()">Start Game</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let gameStarted = false;
let score = 0;

let highScore =
parseInt(localStorage.getItem("highScore")) || 0;

document.getElementById("highScore").innerText =
"High Score: " + highScore;

const gravity = 0.45;
const jumpPower = -9;

const boomerang = {
    x:120,
    y:250,
    width:50,
    height:50,
    velocity:0,
    rotation:0
};

const obstacles = [];

function startGame(){

    document.getElementById("startScreen").style.display = "none";

    score = 0;
    obstacles.length = 0;

    boomerang.y = canvas.height / 2;
    boomerang.velocity = 0;

    document.getElementById("score").innerText =
    "Score: 0";

    gameStarted = true;
}

function flap(){
    if(gameStarted){
        boomerang.velocity = jumpPower;
    }
}

document.addEventListener("keydown", function(e){
    if(e.code === "Space"){
        flap();
    }
});

document.addEventListener("mousedown", flap);
document.addEventListener("touchstart", flap);

function createObstacle(){

    const gap = 220;

    const topHeight =
    Math.random() * (canvas.height - gap - 250) + 80;

    obstacles.push({
        x:canvas.width,
        width:90,
        top:topHeight,
        bottom:canvas.height - topHeight - gap,
        passed:false
    });
}

setInterval(function(){

    if(gameStarted){
        createObstacle();
    }

},1800);

function gameOver(){

    gameStarted = false;

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "highScore",
            highScore
        );

        document.getElementById("highScore").innerText =
        "High Score: " + highScore;
    }

    alert("Game Over!\nScore: " + score);

    document.getElementById("startScreen").style.display =
    "flex";
}

function update(){

    if(!gameStarted) return;

    boomerang.velocity += gravity;
    boomerang.y += boomerang.velocity;

    if(
        boomerang.y < 0 ||
        boomerang.y + boomerang.height >
        canvas.height - 80
    ){
        gameOver();
        return;
    }

    for(let i=0;i<obstacles.length;i++){

        const pipe = obstacles[i];

        pipe.x -= 5;

        if(
            boomerang.x < pipe.x + pipe.width &&
            boomerang.x + boomerang.width > pipe.x &&
            (
                boomerang.y < pipe.top ||
                boomerang.y + boomerang.height >
                canvas.height - pipe.bottom
            )
        ){
            gameOver();
            return;
        }

        if(
            !pipe.passed &&
            pipe.x + pipe.width < boomerang.x
        ){
            pipe.passed = true;
            score++;

            document.getElementById("score").innerText =
            "Score: " + score;
        }
    }

    while(
        obstacles.length &&
        obstacles[0].x < -100
    ){
        obstacles.shift();
    }
}

function drawBackground(){

    const sky =
    ctx.createLinearGradient(
        0,
        0,
        0,
        canvas.height
    );

    sky.addColorStop(0,"#6EC6FF");
    sky.addColorStop(1,"#B3E5FC");

    ctx.fillStyle = sky;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.beginPath();
    ctx.arc(
        canvas.width-130,
        100,
        50,
        0,
        Math.PI*2
    );
    ctx.fillStyle="#FFD700";
    ctx.fill();

    ctx.font="120px serif";
    ctx.fillText(
        "🦘",
        canvas.width-250,
        canvas.height-90
    );

    ctx.fillText(
        "🌏",
        50,
        canvas.height-130
    );
}

function drawGround(){

    ctx.fillStyle="#d2a679";

    ctx.fillRect(
        0,
        canvas.height-80,
        canvas.width,
        80
    );
}

function drawBoomerang(){

    ctx.save();

    ctx.translate(
        boomerang.x + 25,
        boomerang.y + 25
    );

    boomerang.rotation += 0.15;

    ctx.rotate(
        boomerang.rotation
    );

    ctx.font = "50px Arial";
    ctx.fillText("🪃",-25,20);

    ctx.restore();
}

function drawObstacles(){

    obstacles.forEach(function(pipe){

        ctx.fillStyle="#2E7D32";

        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        ctx.fillRect(
            pipe.x,
            canvas.height-pipe.bottom,
            pipe.width,
            pipe.bottom
        );

        ctx.font="40px Arial";

        ctx.fillText(
            "🌳",
            pipe.x+15,
            pipe.top-10
        );

        ctx.fillText(
            "🌳",
            pipe.x+15,
            canvas.height-pipe.bottom+45
        );
    });
}

function draw(){

    drawBackground();
    drawObstacles();
    drawGround();
    drawBoomerang();
}

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>
</body>
</html>
