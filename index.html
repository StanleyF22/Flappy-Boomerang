<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Boomerang 🇦🇺</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#87CEEB;
}

canvas{
    display:block;
    background:linear-gradient(#6ec6ff,#87CEEB);
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

#startScreen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
    color:white;
    text-align:center;
}

button{
    margin-top:20px;
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="score">0</div>

<div id="startScreen">
    <h1>🪃 Flappy Boomerang</h1>
    <p>Fly across Australia and dodge the gum trees!</p>
    <button onclick="startGame()">Start Game</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameStarted = false;
let score = 0;

const gravity = 0.4;
const jump = -8;

const boomerang = {
    x:120,
    y:canvas.height/2,
    width:45,
    height:45,
    velocity:0,
    rotation:0
};

const pipes = [];

function startGame(){
    document.getElementById("startScreen").style.display="none";

    score = 0;
    pipes.length = 0;

    boomerang.y = canvas.height/2;
    boomerang.velocity = 0;

    gameStarted = true;
}

function flap(){
    if(gameStarted){
        boomerang.velocity = jump;
    }
}

document.addEventListener("keydown", e=>{
    if(e.code==="Space") flap();
});

document.addEventListener("click", flap);

function createPipe(){

    const gap = 220;

    const topHeight =
        Math.random() * (canvas.height - gap - 200) + 50;

    pipes.push({
        x:canvas.width,
        width:90,
        top:topHeight,
        bottom:canvas.height-topHeight-gap,
        passed:false
    });
}

setInterval(()=>{
    if(gameStarted){
        createPipe();
    }
},1800);

function drawBoomerang(){

    ctx.save();

    ctx.translate(
        boomerang.x + boomerang.width/2,
        boomerang.y + boomerang.height/2
    );

    boomerang.rotation += 0.12;
    ctx.rotate(boomerang.rotation);

    ctx.font="40px Arial";
    ctx.fillText("🪃",-20,15);

    ctx.restore();
}

function drawGround(){

    ctx.fillStyle="#d4a15a";
    ctx.fillRect(0,canvas.height-80,canvas.width,80);

    ctx.fillStyle="#4CAF50";

    for(let i=0;i<canvas.width;i+=40){
        ctx.fillRect(i,canvas.height-85,25,10);
    }
}

function drawSun(){
    ctx.beginPath();
    ctx.arc(canvas.width-150,100,50,0,Math.PI*2);
    ctx.fillStyle="#FFD700";
    ctx.fill();
}

function drawCloud(x,y){

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(x,y,25,0,Math.PI*2);
    ctx.arc(x+25,y-15,30,0,Math.PI*2);
    ctx.arc(x+55,y,25,0,Math.PI*2);
    ctx.fill();
}

function gameOver(){

    alert("Game Over! Score: " + score);

    document.getElementById("startScreen").style.display="flex";

    gameStarted = false;
}

function update(){

    if(!gameStarted) return;

    boomerang.velocity += gravity;
    boomerang.y += boomerang.velocity;

    if(
        boomerang.y < 0 ||
        boomerang.y + boomerang.height >
        canvas.height - 80
    ){
        gameOver();
    }

    pipes.forEach(pipe=>{

        pipe.x -= 4;

        if(
            boomerang.x < pipe.x + pipe.width &&
            boomerang.x + boomerang.width > pipe.x &&
            (
                boomerang.y < pipe.top ||
                boomerang.y + boomerang.height >
                canvas.height - pipe.bottom
            )
        ){
            gameOver();
        }
